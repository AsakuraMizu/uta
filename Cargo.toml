[package]
name = "uta"
version = "0.1.0"
edition = "2024"
description = "Transparent proxy controller for sing-box"
authors = ["朝倉水希 <mizuk1@mzk1.dev>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/AsakuraMizu/uta"
publish = false

[dependencies]
anyhow = "1.0.105"
askama = "0.16.1"
bytes = "1.12.2"
caps = "0.5.6"
clap = { version = "4.6.10", features = ["derive", "env"] }
clap_complete = { version = "4.6.12", features = ["unstable-dynamic"] }
compio = { version = "0.19.2", features = ["macros", "net", "process", "signal", "time", "fs", "bytes", "io-codec-serde-json", "linux_pidfd"] }
futures-channel = "0.3.34"
futures-util = "0.3.34"
ipnet = "2.12.2"
netlink-packet-route = "0.34.0"
netlink-sys = { version = "0.9.0", default-features = false }
nix = { version = "0.31.4", features = ["fs", "user", "signal", "socket", "inotify"] }
rtnetlink = { version = "0.24.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
toml = "1.2.3"

# Needs the topology tests/e2e/lab.sh deploys; run with `cargo test --test e2e`.
[[test]]
name = "e2e"
test = false
